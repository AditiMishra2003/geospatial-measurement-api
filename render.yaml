services:
  - type: web
    name: geospatial-measurement-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER
        value: "true"
    # No disk — uploaded files go to /tmp (free tier compatible)
    # Parsed feature data is persisted in SQLite DB
